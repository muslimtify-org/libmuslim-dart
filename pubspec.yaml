  ffi: ^2.1.4
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.0

dev_dependencies:
  ffigen: ^21.0.0
  flutter_lints: ^6.0.0
  test: ^1.28.0
