version: 0.1.0
repository: https://github.com/muslimtify-org/libmuslim-dart
issue_tracker: https://github.com/muslimtify-org/libmuslim-dart/issues

topics:
  - ffi
  - islam
  - prayer-times
  - muslim

environment:
