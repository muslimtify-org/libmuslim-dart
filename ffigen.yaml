# Run with `dart run ffigen --config ffigen.yaml`.
name: LibmuslimDartBindings
description: |
  Bindings for `src/libmuslim_dart.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/libmuslim_dart_bindings_generated.dart'
headers:
  entry-points:
    - 'src/libmuslim_dart.h'
  include-directives:
    - 'src/libmuslim_dart.h'
ffi-native:
comments:
  style: any
  length: full
