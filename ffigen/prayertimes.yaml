# Regenerate with `dart run tool/regen.dart`, which runs every config in this
# directory. Invoking ffigen directly works only if CPATH already points at
# clang's resource include directory; tool/regen.dart sets that for you.
name: PrayertimesBindings
description: |
  Raw bindings for `src/prayertimes.h`.

  Regenerate with `dart run ffigen --config ffigen/prayertimes.yaml`.
output: '../lib/src/prayertimes/prayertimes_bindings_generated.dart'
headers:
  entry-points:
    - '../src/prayertimes.h'
  include-directives:
    - '../src/prayertimes.h'
ffi-native:
  # Must equal `package:<packageName>/<assetName>` from hook/build.dart.
  # Without it, @Native resolves against this file's own package URI, which
  # no build hook produces.
  asset-id: 'package:libmuslim/libmuslim_bindings_generated.dart'
comments:
  style: any
  length: full
